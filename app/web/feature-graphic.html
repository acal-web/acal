<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACAL - Feature Graphic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .feature-graphic {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        /* Elementos decorativos de fundo */
        .bg-element {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
        }

        .bg-left {
            left: -80px;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 300px;
            background: rgba(10, 10, 10, 0.08);
        }

        .bg-right {
            right: -100px;
            bottom: -50px;
            width: 350px;
            height: 350px;
            background: rgba(10, 10, 10, 0.06);
            filter: blur(70px);
        }

        /* Conteúdo principal */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding: 0 60px;
            max-width: 900px;
        }

        /* Ícone de água */
        .water-icon {
            width: 80px;
            height: 80px;
            background: #0A0A0A;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .water-icon svg {
            width: 48px;
            height: 48px;
            fill: #FFFFFF;
        }

        /* Título */
        .title-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .title {
            font-size: 48px;
            font-weight: 700;
            color: #0A0A0A;
            line-height: 1.2;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .divider {
            height: 4px;
            width: 120px;
            background: #0A0A0A;
        }

        /* Subtítulo */
        .subtitle {
            font-size: 18px;
            font-weight: 400;
            color: #171717;
            line-height: 1.5;
            letter-spacing: 0.2px;
            margin: 0;
        }

        /* Footer com logo */
        .footer {
            position: absolute;
            bottom: 28px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-text {
            font-size: 14px;
            font-weight: 600;
            color: #0A0A0A;
            letter-spacing: 0.5px;
        }

        /* Responsivo para preview */
        @media (max-width: 1200px) {
            .feature-graphic {
                width: 90vw;
                height: calc(90vw * 0.488);
            }
        }
    </style>
</head>
<body>
    <div class="feature-graphic">
        <!-- Elementos decorativos -->
        <div class="bg-element bg-left"></div>
        <div class="bg-element bg-right"></div>

        <!-- Conteúdo principal -->
        <div class="content">
            <!-- Ícone de água -->
            <div class="water-icon">
                <svg viewBox="0 0 48 48">
                    <path d="M24 4C24 4 16 16 16 24C16 30.63 19.58 36 24 36C28.42 36 32 30.63 32 24C32 16 24 4 24 4Z"/>
                </svg>
            </div>

            <!-- Título -->
            <div class="title-section">
                <h1 class="title">Economizar água<br>é dever de todo ser humano</h1>
                <div class="divider"></div>
            </div>

            <!-- Subtítulo -->
            <p class="subtitle">Gerencie e controle seu consumo</p>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span class="footer-text">ACAL</span>
        </div>
    </div>
</body>
</html>
