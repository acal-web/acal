# SonarCloud project configuration for the Flutter app.
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/languages/dart/
sonar.projectKey=acalapp
sonar.organization=acal-web
sonar.projectName=acalapp

sonar.sources=lib
# integration_test/ holds the Patrol E2E suite — declared as test code so
# Sonar doesn't score it as uncovered production code.
sonar.tests=test,integration_test
sonar.exclusions=build/**,.dart_tool/**,android/**,ios/**,macos/**,linux/**,windows/**,web/**,legacy/**

# lcov.info comes from `flutter test --coverage` (unit/widget tests);
# e2e_lcov.info comes from the Patrol E2E suite run via
# `flutter test integration_test/*_test.dart --coverage` (scripts/run_e2e.sh).
# The CI `sonar` job downloads both before scanning; comma-separated paths
# are merged by Sonar's Dart coverage sensor.
sonar.dart.lcov.reportPaths=coverage/lcov.info,coverage/e2e_lcov.info
