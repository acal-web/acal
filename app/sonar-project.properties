# SonarCloud project configuration for the Flutter app.
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/languages/dart/
sonar.projectKey=acalapp
sonar.organization=acal-web
sonar.projectName=acalapp

sonar.sources=lib
# integration_test/ holds the Patrol E2E suite — declared as test code so
# Sonar doesn't score it as uncovered production code. Coverage still comes
# only from `flutter test`; E2E runs produce no lcov and shouldn't.
sonar.tests=test,integration_test
sonar.exclusions=build/**,.dart_tool/**,android/**,ios/**,macos/**,linux/**,windows/**,web/**,legacy/**

sonar.dart.lcov.reportPaths=coverage/lcov.info
