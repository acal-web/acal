# SonarCloud project configuration for the Flutter app.
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/languages/dart/
#
# Create this project manually on SonarCloud: "+" → Analyze new project →
# Manually → organization "megalexandre" → project key "megalexandre_acal-app"
# (or update the two lines below if you pick a different key).
sonar.projectKey=megalexandre_acal-app
sonar.organization=megalexandre
sonar.projectName=Acal App

sonar.sources=lib
sonar.tests=test,integration_test
sonar.exclusions=build/**,.dart_tool/**,android/**,ios/**,macos/**,linux/**,windows/**,web/**,legacy/**

sonar.dart.lcov.reportPaths=coverage/lcov.info
