url: http://localhost:8080/#/customers
---
- launchApp
# Generous timeout: first navigation after a (re)start triggers a cold
# dartdevc module compile that can take 30-60s depending on machine load.
- extendedWaitUntil:
    visible: "Sócios"
    timeout: 240000

# Arrange: two sócios, one shared address, one category — the second
# connection attempt below reuses the same address, which is what should be
# rejected (Connection#address_not_already_active).
- runFlow:
    file: ../../../subflows/customers/create_customer.yaml
    env:
      NAME: "Maestro Endereco Ativo Socio Um"
      DOCUMENT: "11122233396"
- runFlow:
    file: ../../../subflows/customers/create_customer.yaml
    env:
      NAME: "Maestro Endereco Ativo Socio Dois"
      DOCUMENT: "22233344405"

- tapOn: "Categorias"
- assertVisible: "Categorias"
- runFlow:
    file: ../../../subflows/categories/create_category.yaml
    env:
      NAME: "Endereco Ativo Categoria"

- tapOn: "Logradouros"
- assertVisible: "Logradouros"
- runFlow:
    file: ../../../subflows/addresses/create_address.yaml
    env:
      NAME: "Endereco Ativo Compartilhado"

- tapOn: "Ligações"
- assertVisible: "Ligações"

# Arrange: the first connection on that address succeeds and stays active.
- runFlow:
    file: ../../../subflows/connections/create_connection.yaml
    env:
      CUSTOMER_SEARCH: "Maestro Endereco Ativo Socio"
      CUSTOMER_NAME: "Maestro Endereco Ativo Socio Um"
      ADDRESS_NAME: "Endereco Ativo Compartilhado"
      CATEGORY_NAME: "Endereco Ativo Categoria"
- assertNotVisible: "Salvar"

# Act: a second, different sócio tries to connect to the same address.
- runFlow:
    file: ../../../subflows/connections/create_connection.yaml
    env:
      CUSTOMER_SEARCH: "Maestro Endereco Ativo Socio"
      CUSTOMER_NAME: "Maestro Endereco Ativo Socio Dois"
      ADDRESS_NAME: "Endereco Ativo Compartilhado"
      CATEGORY_NAME: "Endereco Ativo Categoria"

# Assert: rejected with a clear message, dialog stays open, no second row.
- assertVisible: "Este logradouro já está com uma ligação ativa."
- assertVisible: "Salvar"
- assertNotVisible: "Maestro Endereco Ativo Socio Dois"
