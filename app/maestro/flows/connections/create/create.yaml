url: http://localhost:8080/#/customers
---
- launchApp
# Generous timeout: first navigation after a (re)start triggers a cold
# dartdevc module compile that can take 30-60s depending on machine load.
- extendedWaitUntil:
    visible: "Sócios"
    timeout: 240000

# Arrange: a connection ties together a customer, an address and a category
# — none exist yet, so create one of each via their own pages first.
- runFlow:
    file: ../../../subflows/customers/create_customer.yaml
    env:
      NAME: "Maestro Ligacao Create Socio"
      DOCUMENT: "11122233396"

- tapOn: "Categorias"
- assertVisible: "Categorias"
- runFlow:
    file: ../../../subflows/categories/create_category.yaml
    env:
      NAME: "Ligacao Create Categoria"

- tapOn: "Logradouros"
- assertVisible: "Logradouros"
- runFlow:
    file: ../../../subflows/address/create_address.yaml
    env:
      NAME: "Ligacao Create Endereco"

- tapOn: "Ligações"
- assertVisible: "Ligações"

# Act
- runFlow:
    file: ../../../subflows/connections/create_connection.yaml
    env:
      CUSTOMER_SEARCH: "Maestro Ligacao Create"
      CUSTOMER_NAME: "Maestro Ligacao Create Socio"
      ADDRESS_NAME: "Ligacao Create Endereco"
      CATEGORY_NAME: "Ligacao Create Categoria"

# Assert
- assertNotVisible: "Selecione o logradouro"
- assertNotVisible: "Salvar"
- assertVisible: "Maestro Ligacao Create Socio"
- assertVisible: "Avenida Ligacao Create Endereco"
- assertVisible: "Ligacao Create Categoria"
