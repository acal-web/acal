url: http://localhost:8080/#/customers
---
- launchApp
# Generous timeout: first navigation after a (re)start triggers a cold
# dartdevc module compile that can take 30-60s depending on machine load.
- extendedWaitUntil:
    visible: "Sócios"
    timeout: 240000

# "Número de Sócio" is optional (Customer#membership_number allow_nil) —
# left untouched here, the row should render "—" in that column.
- tapOn: "Adicionar"
- assertVisible: "Novo Sócio"
- tapOn: "Digite o nome do sócio"
- inputText: "Maestro Create Sem Numero"
- tapOn: "000.000.000-00"
- inputText: "22233344405"
- tapOn: "Salvar"
- assertNotVisible: "Digite o nome do sócio"
- assertNotVisible: "Salvar"

- assertVisible: "Maestro Create Sem Numero"
- assertVisible: "222.333.444-05"
- assertVisible: "—"
