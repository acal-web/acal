url: http://localhost:8080/#/customers
---
- launchApp
# Generous timeout: first navigation after a (re)start triggers a cold
# dartdevc module compile that can take 30-60s depending on machine load.
- extendedWaitUntil:
    visible: "Sócios"
    timeout: 240000

# Arrange: a sócio with a known document, then soft delete it.
- runFlow:
    file: ../../../subflows/customers/create_customer.yaml
    env:
      NAME: "Maestro Duplicado Inativo Original"
      DOCUMENT: "11122233396"

- tapOn: "Excluir"
- assertVisible: "Excluir sócio"
- tapOn:
    id: "confirm-delete-button"
- assertNotVisible: "Excluir sócio"
- assertNotVisible: "Maestro Duplicado Inativo Original"

# Act: try to register a different sócio with the same (now inactive) document.
- tapOn: "Adicionar"
- assertVisible: "Novo Sócio"
- tapOn: "Digite o nome do sócio"
- inputText: "Maestro Duplicado Inativo Novo"
- tapOn: "000.000.000-00"
- inputText: "11122233396"
- tapOn: "Salvar"

# Assert: rejected, offering to reactivate instead of creating a new record.
- assertVisible: "Esse sócio já está cadastrado, porém inativo. É possível reativar."
- assertVisible: "Salvar"
- assertNotVisible: "Maestro Duplicado Inativo Novo"
