url: http://localhost:8080/#/customers
---
- launchApp
# Generous timeout: first navigation after a (re)start triggers a cold
# dartdevc module compile that can take 30-60s depending on machine load.
- extendedWaitUntil:
    visible: "Sócios"
    timeout: 240000

- assertVisible: "Adicionar"
- tapOn: "Adicionar"
- assertVisible: "Novo Sócio"
- tapOn: "Digite o nome do sócio"
- inputText: "Maestro Create Socio"
- tapOn: "000.000.000-00"
- inputText: "11122233396"
- tapOn: "Número de Sócio (opcional)"
- inputText: "42"
- tapOn: "É votante"
- tapOn: "Salvar"
- assertNotVisible: "Digite o nome do sócio"
- assertNotVisible: "Salvar"

# Assert every column in the new row.
- assertVisible: "Maestro Create Socio"
- assertVisible: "111.222.333-96"
- assertVisible: "42"
- assertVisible: "Sim"
