url: http://localhost:8080/#/customers
---
- launchApp
# Generous timeout: first navigation after a (re)start triggers a cold
# dartdevc module compile that can take 30-60s depending on machine load.
- extendedWaitUntil:
    visible: "Sócios"
    timeout: 240000

# "É votante" left unchecked (defaults to false) — the row should show
# "Não" in the Votante column.
- tapOn: "Adicionar"
- assertVisible: "Novo Sócio"
- tapOn: "Digite o nome do sócio"
- inputText: "Maestro Create Sem Voto"
- tapOn: "000.000.000-00"
- inputText: "33344455508"
- tapOn: "Salvar"
- assertNotVisible: "Digite o nome do sócio"
- assertNotVisible: "Salvar"

- assertVisible: "Maestro Create Sem Voto"
- assertVisible: "333.444.555-08"
- assertVisible: "Não"
