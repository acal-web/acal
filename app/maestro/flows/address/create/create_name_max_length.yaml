url: http://localhost:8080/#/addresses
---
- launchApp
# Generous timeout: first navigation after a (re)start triggers a cold
# dartdevc module compile that can take 30-60s depending on machine load.
- extendedWaitUntil:
    visible: "Logradouros"
    timeout: 240000

# Boundary: 255 characters is the maximum allowed by Address#name validation
# (validates :name, length: { maximum: 255 }) — anything longer must be rejected.
- assertVisible: "Novo Endereço"
- tapOn: "Novo Endereço"
- assertVisible: "Avenida"
- tapOn: "Digite o logradouro"
- inputText: "Fernando Daltro Max Length AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
- tapOn: "Salvar"
- assertNotVisible: "Digite o logradouro"
- assertNotVisible: "Salvar"
# The success toast is transient (auto-dismisses after a few seconds) and can
# be missed under load, so the durable signal is the row landing in the
# table, not the toast text itself.
- assertVisible: "Avenida Fernando Daltro Max Length AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
