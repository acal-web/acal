# Subflow: creates a category fixture (group: Efetivo) via the UI, with
# nominal water/membership prices. Parameterized by NAME only — every current
# caller needs an "Efetivo" category, since that's the group the "one active
# efetivo connection per sócio" rule cares about.
#
# Lives outside flows/ on purpose: run.sh discovers tests via
# `find app/maestro/flows -name '*.yaml'` and runs each as its own
# `maestro test`, which would fail here since NAME is only bound when this
# file is invoked via runFlow.
url: http://localhost:8080/#/categories
---
- tapOn: "Nova Categoria"
- tapOn: "Digite o nome da categoria"
- inputText: "${NAME}"
- tapOn: "Temporário"
- tapOn: "Efetivo"
- tapOn:
    id: "water-price-field"
- inputText: "1000"
- tapOn:
    id: "membership-price-field"
- inputText: "1000"
- tapOn: "Salvar"
# The success toast is transient (auto-dismisses after a few seconds) and can
# be missed under load, so the durable signal is the row landing in the
# table, not the toast text itself.
- assertVisible: "${NAME}"
