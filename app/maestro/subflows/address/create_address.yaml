# Subflow: creates an address fixture via the UI. Called with `runFlow` by
# specs where creation is just the setup for a different test subject
# (update/delete), not the thing under test — parameterized by NAME so each
# caller gets a distinct, assertable row.
#
# Lives outside flows/ on purpose: run.sh discovers tests via
# `find app/maestro/flows -name '*.yaml'` and runs each as its own
# `maestro test`, which would fail here since NAME is only bound when this
# file is invoked via runFlow.
- tapOn: "Novo Endereço"
- tapOn: "Digite o logradouro"
- inputText: "${NAME}"
- tapOn: "Salvar"
# The success toast is transient (auto-dismisses after a few seconds) and can
# be missed under load, so the durable signal is the row landing in the
# table, not the toast text itself.
- assertVisible: "Avenida ${NAME}"
