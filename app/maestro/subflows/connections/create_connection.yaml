# Subflow: creates a connection (ligação) fixture via the UI, wiring together
# an already-existing customer/address/category — create those first via
# their own subflows. Doesn't assert success: some callers use this to set
# up a connection that's *expected* to fail (e.g. address already active),
# leaving that assertion to the caller.
#
# CUSTOMER_SEARCH must be a strict prefix of CUSTOMER_NAME (not the full
# name) — the sócio field is a search-as-you-type picker, and the typed
# query stays visible in the field itself, so searching for the exact full
# name would leave two "${CUSTOMER_NAME}" matches on screen (the query and
# the suggestion) for `tapOn` to trip over.
#
# Lives outside flows/ on purpose: run.sh discovers tests via
# `find app/maestro/flows -name '*.yaml'` and runs each as its own
# `maestro test`, which would fail here since these env vars are only bound
# when this file is invoked via runFlow.
url: http://localhost:8080/#/connections
---
- tapOn: "Nova Ligação"
- tapOn: "Buscar sócio por nome"
- inputText: "${CUSTOMER_SEARCH}"
- extendedWaitUntil:
    visible: "${CUSTOMER_NAME}"
    timeout: 10000
- tapOn: "${CUSTOMER_NAME}"
- tapOn: "Selecione o logradouro"
- tapOn: "${ADDRESS_NAME}"
- tapOn: "Selecione a categoria"
- tapOn: "${CATEGORY_NAME}"
- tapOn: "Salvar"
