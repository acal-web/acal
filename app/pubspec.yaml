name: acalapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.2.3
  http: ^1.2.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  printing: ^5.14.2
  forui: ^0.25.0
  month_year_picker: ^0.5.0+1
  qr_flutter: ^4.1.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

fonts:
  - family: Inter
    fonts:
      - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf