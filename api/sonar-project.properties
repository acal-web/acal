# SonarCloud project configuration for the Rails API.
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/languages/ruby/
sonar.projectKey=megalexandre_acal
sonar.organization=megalexandre
sonar.projectName=Acal API

sonar.sources=app,lib,config
sonar.tests=spec
sonar.exclusions=vendor/**,tmp/**,log/**,storage/**,db/**,public/**
sonar.test.exclusions=spec/**

sonar.ruby.coverage.reportPaths=coverage/coverage.json
