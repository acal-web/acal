services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DB_HOST: db
      DB_USERNAME: api
      DB_PASSWORD: password
      DB_NAME: api_development
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: password
      POSTGRES_DB: api_development
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
